services:
  - type: web
    name: jobsearch-ai-backend
    runtime: docker
    branch: main
    plan: 1c-2g
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: CHROME_PATH
        value: /usr/bin/chromium
      - key: DATABASE_PATH
        value: /app/data/careercompass.sqlite
      - key: NETLIFY_SITE_ID
        sync: false
      - key: NETLIFY_BLOBS_TOKEN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_BASE_URL
        sync: false
      - key: REPO_DIR
        sync: false
    disk:
      name: jobsearch-ai-data
      mountPath: /app/data
      sizeGB: 10
