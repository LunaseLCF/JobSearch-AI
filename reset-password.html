<!DOCTYPE html>
<html lang="en" data-type="software" data-radius="soft" data-buttons="solid">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password · AI Job Search</title>
<meta name="page-type" content="software">
<meta name="site-kind" content="software">
<meta name="description" content="Search live jobs, match listings to your profile, track applications, and prepare interviews in one workspace.">
<meta name="theme-color" content="#f3f1ec">
<meta property="og:type" content="website">
<meta property="og:title" content="AI Job Search — career assistant">
<meta property="og:description" content="Your AI-powered career assistant.">
<link rel="icon" href="/favicon.ico">
<script src="/js/device.js"></script>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<main class="shell" id="main" tabindex="-1">
  <svg class="brand-mark" viewBox="0 0 100 100" fill="none" aria-hidden="true">
    <circle cx="50" cy="50" r="42" stroke="#35e6ff" stroke-width="7"/>
    <path d="M31 51 45 65 70 36" stroke="#35e6ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="eyebrow" id="eyebrow">ACCOUNT RECOVERY</div>
  <h1 id="title">Choose a new password</h1>
  <p class="sub" id="subtitle">Verifying your reset link…</p>

  <div class="account-box" id="accountBox" style="display:none"></div>
  <div class="status" id="status" role="status" aria-live="polite"></div>

  <form id="resetForm" style="display:none">
    <label class="field-label" for="password">New password</label>
    <div class="input-wrap"><input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters"></div>
    <label class="field-label" for="confirmPassword">Confirm new password</label>
    <div class="input-wrap"><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Repeat your new password"></div>
    <button class="submit" id="submitBtn" type="submit"><span id="submitText">Reset password</span></button>
  </form>

  <div class="links"><a href="/login">Back to sign in</a></div>
</main>

<script>
  const API = (location.port === '3100' || location.port === '') ? '' : 'http://127.0.0.1:3100';
  const status = document.getElementById('status');
  const form = document.getElementById('resetForm');
  const password = document.getElementById('password');
  const confirm = document.getElementById('confirmPassword');
  const submitBtn = document.getElementById('submitBtn');
  const submitText = document.getElementById('submitText');
  const accountBox = document.getElementById('accountBox');
  const subtitle = document.getElementById('subtitle');
  const token = new URLSearchParams(location.search).get('token') || '';

  function setStatus(message, kind) {
    status.textContent = message;
    status.className = 'status' + (kind ? ' ' + kind : '');
  }

  async function validateToken() {
    if (!token) {
      subtitle.textContent = 'This link is incomplete.';
      setStatus('The reset link is missing its token. Please request a new one from the sign-in page.', 'error');
      return;
    }
    try {
      const res = await fetch(API + '/api/reset-password/validate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
        body: JSON.stringify({ token }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        subtitle.textContent = 'This link can no longer be used.';
        setStatus(data.error || 'This reset link is invalid or has expired.', 'error');
        return;
      }
      subtitle.textContent = 'Enter a new password for your account.';
      accountBox.style.display = 'block';
      accountBox.textContent = 'Account: ' + data.email;
      form.style.display = 'block';
      password.focus();
    } catch (e) {
      setStatus('Cannot reach the application server. Make sure the app is running on port 3100.', 'error');
    }
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    setStatus('', '');
    if (password.value.length < 8) { setStatus('Password must be at least 8 characters.', 'error'); password.focus(); return; }
    if (password.value !== confirm.value) { setStatus('Passwords do not match.', 'error'); confirm.focus(); return; }
    submitBtn.disabled = true;
    submitText.textContent = 'Saving…';
    try {
      const res = await fetch(API + '/api/reset-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
        body: JSON.stringify({ token, password: password.value }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) {
        setStatus(data.error || 'Could not reset your password.', 'error');
      } else {
        form.style.display = 'none';
        accountBox.style.display = 'none';
        subtitle.textContent = 'All done.';
        setStatus('Your password has been reset. You can now sign in with your new password.', 'success');
        setTimeout(() => { window.location.href = '/login?reset=1'; }, 1500);
        return;
      }
    } catch (err) {
      setStatus('Cannot reach the application server. Please try again.', 'error');
    }
    submitBtn.disabled = false;
    submitText.textContent = 'Reset password';
  });

  const reason = new URLSearchParams(location.search).get('reason');
  if (reason === 'reset') setStatus('Your password has been reset. Please sign in.', 'success');
  validateToken();
</script>
</body>
</html>
