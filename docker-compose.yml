version: '3.8'

services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CHROME_PATH=/usr/bin/chromium
      # Set to true when the site is served over HTTPS.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
      # Optional: point this at a checked-out source repository for Repo Browser.
      - REPO_DIR=${REPO_DIR:-/app/ai-job-search}
    volumes:
      # Persist user data outside the container.
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
